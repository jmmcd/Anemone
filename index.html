<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anemone Interactive Evolutionary Algorithm</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top app bar: persistent chrome. On wide pointer-fine screens it carries
         an inline Evolve button; on touch/narrow that role moves to the FAB. -->
    <header class="app-bar">
        <button id="menu-btn" class="icon-btn" aria-label="Open controls">☰</button>
        <h1 class="app-title">Anemone</h1>
        <span class="gen-indicator">Gen <span id="generation">0</span></span>
        <button id="evolve-btn" class="evolve-bar">
            Evolve<span class="sel-badge" id="selected-count-bar">0</span>
        </button>
    </header>

    <main class="container">
        <a href="#" id="about-link" class="about-link">About</a>
        <div class="grid" id="grid"></div>
    </main>

    <!-- Floating Evolve button (touch / narrow): thumb-reachable. -->
    <button id="evolve-fab" class="fab" aria-label="Evolve next generation">
        <span class="fab-icon">⟳</span>
        <span class="sel-badge" id="selected-count-fab">0</span>
    </button>

    <!-- Auxiliary controls drawer (everywhere). -->
    <div id="drawer-scrim" class="scrim"></div>
    <aside id="drawer" class="drawer" aria-label="Controls">
        <div class="drawer-header">
            <h2>Controls</h2>
            <button id="drawer-close" class="icon-btn" aria-label="Close controls">✕</button>
        </div>

        <section class="drawer-section">
            <h3>Population</h3>
            <button id="reset-btn" class="secondary-btn">Reset</button>
            <button id="load-png-btn" class="secondary-btn">Load…</button>
            <input type="file" id="load-png-input" accept="image/png,audio/wav,.wav,audio/midi,.mid,.midi" style="display: none;">
            <button id="save-population-btn" class="secondary-btn">Save Population</button>
            <button id="save-liked-btn" class="secondary-btn">Save Liked (ZIP)</button>
            <div class="info-line">
                Selected <span id="selected-count">0</span> ·
                Pop <span id="population-size">16</span> ·
                Avg <span id="avg-fitness">0.00</span>
            </div>
        </section>

        <section class="drawer-section">
            <h3>Individual Type</h3>
            <!-- Options are built at startup from INDIVIDUAL_TYPES (IndividualRegistry.js). -->
            <select id="individual-type-select"></select>
        </section>

        <section class="drawer-section" id="palette-section">
            <h3>Palette</h3>
            <div id="extensions-container" class="extensions-container"></div>
        </section>

        <section class="drawer-section">
            <h3>Generation History</h3>
            <div id="history-list" class="history-list"></div>
        </section>

        <footer class="drawer-footer">
            <a href="https://github.com/jmmcd/anemone" target="_blank" rel="noopener noreferrer">View on GitHub</a>
        </footer>
    </aside>

    <!-- Placement banner: shown after loading a PNG, while the user picks the
         grid tile to replace with the loaded individual. -->
    <div id="place-banner" class="place-banner">
        <canvas id="place-preview" width="64" height="64"></canvas>
        <span class="place-text">Click a tile to replace it with this loaded individual.</span>
        <button id="place-cancel" class="secondary-btn">Cancel</button>
    </div>

    <!-- About page (opened from the link above the grid; closes back to it). -->
    <div id="about-modal" class="lightbox about-modal">
        <div class="lightbox-inner about-inner">
            <button id="about-close" class="icon-btn lightbox-close" aria-label="Close">✕</button>
            <div id="about-content" class="about-content">Loading…</div>
        </div>
    </div>

    <!-- Zoom lightbox (long-press on touch, double-click / ⛶ on pointer-fine). -->
    <div id="lightbox" class="lightbox">
        <div class="lightbox-inner">
            <button id="lightbox-close" class="icon-btn lightbox-close" aria-label="Close">✕</button>
            <button id="lightbox-save" class="lightbox-save" aria-label="Save image">⤓ Save</button>
            <button id="lightbox-export-stl" class="lightbox-save lightbox-export-stl" aria-label="Export STL for 3D printing">⤓ STL</button>
            <button id="lightbox-export-wav" class="lightbox-save lightbox-export-wav" aria-label="Export WAV audio">⤓ WAV</button>
            <button id="lightbox-export-midi" class="lightbox-save lightbox-export-midi" aria-label="Export MIDI file">⤓ MIDI</button>
            <canvas id="lightbox-canvas" width="768" height="768"></canvas>
            <div id="lightbox-info" class="genome-content"></div>
        </div>
    </div>

    <!-- Third-party libraries -->
    <script src="https://d3js.org/d3-color.v3.min.js"></script>
    <script src="https://d3js.org/d3-interpolate.v3.min.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="vendor/pto-bundle.js"></script>

    <!-- App-level services (window.Palette / Photo / AudioClip / MIDISync / OSCInput / SITLanguage) -->
    <script src="services/Palette.js"></script>
    <script src="services/Photo.js"></script>
    <script src="services/AudioClip.js"></script>

    <!-- Export helpers -->
    <script src="export/ExportNaming.js"></script>
    <script src="export/ImageSave.js"></script>
    <script src="export/MeshExport.js"></script>
    <script src="export/AudioExport.js"></script>
    <script src="export/MidiExport.js"></script>

    <!-- Individual base class -->
    <script src="framework/Individual.js"></script>

    <!-- UI drawer panels + shared services they depend on -->
    <script src="ui/PaletteControlUI.js"></script>
    <script src="ui/PhotoControlUI.js"></script>
    <script src="ui/AudioControlUI.js"></script>
    <script src="services/MIDISync.js"></script>
    <script src="ui/MIDISyncUI.js"></script>
    <script src="services/OSCInput.js"></script>
    <script src="ui/OSCInputUI.js"></script>
    <script src="ui/PerformanceControls.js"></script>
    <script src="ui/CodeEditorUI.js"></script>

    <!-- Representation and Modality helpers -->
    <script src="representations/TreeRepresentation.js"></script>
    <script src="representations/DAGRepresentation.js"></script>
    <script src="representations/PTORepresentation.js"></script>
    <script src="modalities/Canvas2DModality.js"></script>
    <script src="modalities/MIDIModality.js"></script>
    <script src="modalities/AudioModality.js"></script>
    <script src="modalities/ThreeDModality.js"></script>

    <!-- Individual types (base classes before their subclasses; see harness SOURCES) -->
    <script src="individuals/GridIndividual.js"></script>
    <script src="individuals/ShapesIndividual.js"></script>
    <script src="individuals/PhotoFilterIndividual.js"></script>
    <script src="individuals/AntRenderingIndividual.js"></script>
    <script src="individuals/AudioFilterIndividual.js"></script>
    <script src="individuals/DrumMachineIndividual.js"></script>
    <script src="individuals/MelodyIndividual.js"></script>
    <script src="individuals/MouseMusicIndividual.js"></script>
    <script src="individuals/EEGSonificationIndividual.js"></script>
    <script src="individuals/PatternIndividual.js"></script>
    <script src="representations/Grammar.js"></script>
    <script src="individuals/PatternGrammarIndividual.js"></script>
    <script src="individuals/AnimatedPatternIndividual.js"></script>
    <script src="individuals/PolarCurveIndividual.js"></script>
    <script src="individuals/AnemoneIndividual.js"></script>
    <script src="individuals/BranchIndividual.js"></script>
    <script src="individuals/LSystemIndividual.js"></script>
    <script src="individuals/StructuralInformationIndividual.js"></script>
    <script src="individuals/StructuralInformationContinuousIndividual.js"></script>
    <script src="services/SITLanguage.js"></script>
    <script src="individuals/SITCodeIndividual.js"></script>
    <script src="individuals/SITCode3DIndividual.js"></script>
    <script src="individuals/BlindWatchmakerIndividual.js"></script>
    <script src="individuals/SuperShapeIndividual.js"></script>
    <script src="individuals/RadialSurface3DIndividual.js"></script>
    <script src="individuals/SuperShape3DIndividual.js"></script>
    <script src="individuals/PetalSphere3DIndividual.js"></script>
    <script src="individuals/FreeSurface3DIndividual.js"></script>
    <script src="individuals/WarpedSurface3DIndividual.js"></script>
    <script src="individuals/JennPolytopeIndividual.js"></script>
    <script src="individuals/EndlessFormsIndividual.js"></script>
    <script src="individuals/RobotIndividual.js"></script>
    <script src="individuals/WonkyGuysIndividual.js"></script>
    <script src="individuals/HoxCreatureIndividual.js"></script>
    <script src="individuals/SheepIndividual.js"></script>
    <script src="individuals/PenroseIndividual.js"></script>
    <script src="individuals/PSystemIndividual.js"></script>

    <!-- Framework (orchestration + registry + entry point) -->
    <script src="framework/EvolutionaryAlgorithm.js"></script>
    <script src="framework/IndividualRegistry.js"></script>
    <script src="framework/Anemone.js"></script>
    <script src="framework/main.js"></script>
</body>
</html>
